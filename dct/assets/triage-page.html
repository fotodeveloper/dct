<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  TRIAGE PAGE — the template dct ships (dct #991). `dct triage page` fills it from a cycle's
  export; nothing in it is edited by hand. Build slots (dct/workflows/triage_page.py):
  - Four constants, replaced whole: CARDS (the findings), CLOSED (null while the cycle is open;
    the owner's recorded answers once closed), SUGGESTED (null unless an agent proposed answers;
    proposals are never decisions) and STRINGS (the string table of the cycle's language,
    dct/assets/triage-strings.json).
  - Placeholders: {{TOPIC}}, {{PROJECT}}, {{CONTEXT}}, {{DATE}}, {{LEDE …}} (plain text) and the
    STORAGE_KEY slugs {{project}} / {{topic}}.
  TEXT: every user-visible text comes from STRINGS. Static elements name their key in
  data-t (text), data-t-aria (aria-label), data-t-placeholder (placeholder) or data-rich (the
  legend: escaped, then **bold**); the script fills them. Composed texts use tx() (plain text,
  for textContent and attribute values set through the DOM) or th() (the same, HTML-escaped,
  for every HTML string). A table value is data, never markup. Card prose (title, context,
  option text and why, the proposal note, CLOSED notes, plain texts) goes through textHtml:
  escaped, then only `code` spans become <code>.
  LAYOUT (keep): two columns (cards + a 340px sticky aside) with the panels "decision
  progress" (overall bar, the groups "decisions to make" = classes fix / verify / quick /
  decide / backlog and "fixes to acknowledge" = note / reject without a proposal, counts, the
  buttons) and "text to paste" (generate, copy, read-only textarea, toast). At <=960px the
  aside is a bottom bar (#sheet-toggle) that expands into a sheet; Escape collapses it.
  CARDS: K-n, title, the rubric fields S O E K / origin / type as chips, the class derived by
  classify() (rubric §4, first match; a coordinator override cls + clsWhy keeps the derived
  class visible), fingerprint, area, source, context, options (radio variants with the tags
  recommended / at the root | hotfix, and why), the decision segment (the class's decision
  marked with the translated data-rec-mark), the owner's note. Cards are grouped by class.
  DECISION TEXT: buildDecisionText() — a pure function inside the <decision-text> markers (no
  DOM, storage or clock; tests run it from this file under node) — writes one header line,
  an optional "starting point" line when proposals exist, and per card
  "K-n: <decision> · <variant word> (k) [annotations] · <notes word>: <note>". Every word comes
  from STRINGS; dct's parser reads the same table for every language.
  SUGGESTED: a card with a proposal shows it in a dashed block (decision, the variant's key,
  the proposer's note) with four reactions — accept, accept with changes, reject, ask; a second
  click undoes. The owner's comment field is always the owner's own; progress counts only the
  owner's decisions. The reaction opens the card's note in the decision text (response.*_tag).
  Storage with SUGGESTED is { v: 3, state: {K-n: {opt, dec, note, resp, seen}} }; a reaction
  whose proposal changed on a rebuild is dropped and the card says so.
  CLOSED: the page reads its state from CLOSED (never from localStorage), shows the closed
  status and panel with the full decision text, and disables its inputs.
  PLAIN (reading aid): a plain.json published beside the page ({ by, date, cards: { K-n:
  { title, problem, was, fix, opts: { key: text }, codex, amends } } }) adds plain-language
  texts per card, with a side-panel toggle plain / full / both (remembered per viewer under
  STORAGE_KEY + '-plain'). Plain texts never touch state, the decision text or the constants;
  without the file nothing changes.
-->
<title>Triage {{TOPIC}}</title>

      --sev-high: #f08a78; --sev-high-soft: #3c1f1a; --sev-med: #e4b25a; --sev-med-soft: #3a2e14;

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
  .panel h2 { font-size: 0.98rem; }

  .chip.low { background: var(--sev-low-soft); color: var(--sev-low); } .chip.owner { background: var(--accent-soft); color: var(--accent); }

  details.panel summary::before { content: "▸ "; color: var(--ink-3); } details.panel[open] summary::before { content: "▾ "; }
  details.panel summary::-webkit-details-marker { display: none; }

  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .seg label { border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; font-size: 0.86rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); position: relative; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg label.rec { border-style: dashed; border-color: var(--ok); }
  .seg label.rec:has(input:checked) { border-style: solid; border-color: var(--accent); }
  .seg label.rec::after { content: attr(data-rec-mark); font-size: 0.68rem; color: var(--ok); font-weight: 600; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .note { width: 100%; min-height: 58px; font: inherit; font-size: 0.9rem; border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; background: var(--surface); color: var(--ink); resize: vertical; }

  .sugg-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 0.82rem; color: var(--ink-3); }
  .sugg-head .section-label { margin: 0; } .sugg-head b { color: var(--ink-2); font-weight: 600; }
  .sugg-what { font-size: 0.92rem; color: var(--ink-2); } .sugg-what b { color: var(--ink); }
  .sugg-note { color: var(--ink-2); font-style: italic; font-size: 0.92rem; }

  .seg .sugmark { font-size: 0.68rem; color: var(--accent); font-weight: 500; border-bottom: 1px dashed var(--accent); }

  .group-title { margin: 10px 0 -4px; color: var(--ink-3); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
  .status { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; background: var(--sev-med-soft); color: var(--sev-med); }
  .status.closed { background: var(--ok-soft); color: var(--ok); }
  .panel.closed { margin-bottom: 16px; border-color: var(--ok); }
  .panel.closed .ctx { max-width: 86ch; }
  .note:disabled { opacity: 1; color: var(--ink); background: var(--surface-2); }
  .layout > *, .card, .opt, .optbody { min-width: 0; }
  .card { overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
  /* PLAIN layer (see header): prosty hides .p-full and .p-oba; pelny hides .p-plain and .p-prosty; oba hides .p-prosty. */
  .plain-block { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 5px; background: var(--surface-2); }
  .plain-block .section-label { margin: 0; } .plain-block p { max-width: 78ch; } .plain-block b { font-weight: 600; }

  body[data-plain="oba"] .p-prosty { display: none !important; }
</style>

<div class="page">
  <header class="top">
    <div class="eyebrow">{{PROJECT}} · {{CONTEXT}} · {{DATE}}</div>
    <div class="status" id="status" data-t="page.status_open"></div>
    <h1>Triage {{TOPIC}}</h1>
    <p class="lede">{{LEDE — what was reviewed, how many items, what the decisions mean}}</p>
    <div class="legend">
      <span class="chip mono">S O E K</span><span data-t="legend.fields"></span>
      <span class="chip high" data-t="class.fix"></span><span class="chip med" data-t="class.verify"></span><span class="chip ok" data-t="class.quick"></span><span class="chip owner" data-t="class.decide"></span><span class="chip low" data-t="class.backlog"></span><span class="chip pre"><span data-t="class.note"></span> / <span data-t="class.reject"></span></span>
      <span><span data-t="legend.class_note"></span> · <b data-t="tag.root"></b> <span data-t="legend.root"></span> · <b data-t="tag.hotfix_short"></b> <span data-t="legend.hotfix"></span></span>
    </div>
  </header>

  <div class="layout">
    <main>
      <section class="panel closed" id="closed-panel" hidden>
        <h2 id="closed-heading"></h2>
        <div class="ctx" id="closed-body"></div>
      </section>
      <div id="cards" class="cards"></div>
    </main>

    <aside class="side">
      <button type="button" class="sheet-toggle" id="sheet-toggle" aria-expanded="false" aria-controls="side-panels"><span id="sheet-summary">0 / 0</span><span class="sheet-action" id="sheet-action" data-t="sheet.show"></span></button>

          <label><input type="radio" name="plain-mode" value="pelny"><span data-t="plain.mode_pelny"></span></label>

</div>

<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'triage-{{project}}-{{topic}}-v1';
  const RUBRIC_VERSION = 2; // review rubric: fields §1, classes §4
  const META = { topic: '{{TOPIC}}', project: '{{project}}' };
  // null while the triage is open; once closed: { date, source, rubric, notes: [...],
  //   answers: { 'K-1': { dec: 'fix'|'verify'|'backlog'|'reject'|'note'|'discuss', opt: 'a', note: '...' } } }
  const CLOSED = null;
  // null unless an agent prefilled proposals; never decisions:
  // { by, date, answers: { 'K-1': { dec, opt, note, by } } }
  const SUGGESTED = null;
  // The string table of the cycle's language (dct/assets/triage-strings.json), filled by dct.

    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(out.value).then(done, function () { toast(tx('toast.no_clipboard')); }); }
    else { toast(tx('toast.no_clipboard')); }
  });
  document.getElementById('btn-rec').addEventListener('click', function () {
    let n = 0;
    CARDS.forEach(function (c) {
      const st = s(c.id);
      if (SUGG) { // accept every proposal the owner has not touched
        const sug = suggestion(c);
        if (sug && !st.resp && !st.dec) { st.resp = 'accept'; st.seen = sig(sug); st.dec = sug.dec; st.opt = sug.opt; delete revised[c.id]; n++; }
        return;
      }
      if (!st.opt) { const r = c.opts.find(function (o) { return o.rec; }); st.opt = r ? r.k : ''; }
      if (!st.dec) st.dec = recDec(c);
    });
    saveState(); syncAll();
    toast(SUGG ? tx('toast.accepted', { n: n }) : tx('toast.recommended'));
  });
  // "Note informational cards": the class's decision on every informational card still without one (its variant stays untouched).
  document.getElementById('btn-note-all').addEventListener('click', function () {
    let n = 0;
    CARDS.filter(infoCard).forEach(function (c) { const st = s(c.id); if (!st.dec) { st.dec = recDec(c); n++; } });
    saveState(); syncAll();
    toast(tx('toast.noted', { n: n }));
  });
  // The artifact viewer never shows confirm(): the button asks for a second click instead.
  let clearArmed = null;
  document.getElementById('btn-clear').addEventListener('click', function (ev) {
    const btn = ev.currentTarget;
    if (!clearArmed) {
      btn.textContent = tx('button.clear_confirm');
      clearArmed = setTimeout(function () { clearArmed = null; btn.textContent = tx('button.clear'); }, 4000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; btn.textContent = tx('button.clear');
    Object.keys(state).forEach(function (k) { delete state[k]; });
    saveState(); syncAll(); document.getElementById('out').value = ''; toast(tx('toast.cleared'));
  });
  let toastTimer = null;
  function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.textContent = ''; }, 4000); }
  applyStrings();
  if (SUGG) {
    const when = SUGG.date ? tx('hint.proposals_date', { date: SUGG.date }) : '';
    document.getElementById('status').textContent = tx('page.status_proposals', { by: proposers() });
    document.getElementById('btn-rec').textContent = tx('button.accept_untouched');
    document.getElementById('rec-hint').textContent = tx('hint.accept_untouched');
    const sh = document.getElementById('suggest-hint'); sh.hidden = false;
    sh.textContent = tx('hint.proposals', { by: proposers(), date: when });
  }
  // Phone: the aside is a bottom bar that expands into a sheet (desktop never shows the toggle).
  const side = document.querySelector('.side'); const sheetToggle = document.getElementById('sheet-toggle');
  function setSheet(open) { side.classList.toggle('open', open); sheetToggle.setAttribute('aria-expanded', String(open)); document.getElementById('sheet-action').textContent = tx(open ? 'sheet.hide' : 'sheet.show'); }
  sheetToggle.addEventListener('click', function () { setSheet(sheetToggle.getAttribute('aria-expanded') !== 'true'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && side.classList.contains('open')) { setSheet(false); sheetToggle.focus(); } });
  render();
  window.addEventListener('resize', fitNotes);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNotes);
  if (CLOSED) {
    const cnt = {}; const open = [];
    CARDS.forEach(function (c) {
      const a = CLOSED.answers[c.id];
      if (!a || !a.dec) { open.push(c.id); return; }
      if (a.dec === 'discuss') open.push(c.id);
      cnt[a.dec] = (cnt[a.dec] || 0) + 1;
    });
    const tally = DECISION_KEYS.filter(function (v) { return cnt[v]; }).map(function (v) { return '<b>' + escapeHtml(String(cnt[v])) + ' × ' + escapeHtml(decLabel(v)) + '</b>'; }).join(', ');
    const status = document.getElementById('status');
    status.className = 'status closed';
    status.textContent = tx('sheet.closed', { date: CLOSED.date }) + (open.length ? tx('closed.status_open', { ids: open.join(', ') }) : '');
    document.getElementById('closed-heading').textContent = tx('closed.heading', { date: CLOSED.date });
    const paras = [th('closed.decided', { n: CARDS.length - open.length, total: CARDS.length }) + ' ' + tally + '.' +
      (open.length ? ' ' + th('closed.undecided', { ids: open.join(', ') }) : '') + ' ' + th('closed.fields'),
      th('closed.source', { source: CLOSED.source })].concat((CLOSED.notes || []).map(function (n) { return textHtml(n); }));
    // Every leaf above is escaped exactly once (data), the <b> tags are the template's own markup.
    document.getElementById('closed-body').innerHTML = paras.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    document.getElementById('closed-panel').hidden = false;
    generate();
    document.querySelectorAll('input:not([name="plain-mode"]), textarea, button:not(#sheet-toggle)').forEach(function (el) { el.disabled = true; });
    const out = document.getElementById('out'); out.disabled = false; out.readOnly = true;
    document.getElementById('btn-copy').disabled = false;
  }
  // PLAIN layer (header comment): plain.json beside the page adds plain-language texts in place.
  const PLAIN_MODES = ['prosty', 'pelny', 'oba'];
  function plainText(v) { return typeof v === 'string' && v.trim() ? v.trim() : ''; }
  // The card at the top of the viewport (the first whose bottom is below the top edge).
  function anchorCard() {
    const cards = document.querySelectorAll('article.card');
    for (let i = 0; i < cards.length; i++) { if (cards[i].getBoundingClientRect().bottom > 8) return cards[i]; }
    return null;
  }
  function setPlainMode(m) {
    if (PLAIN_MODES.indexOf(m) < 0) m = 'prosty';
    const a = anchorCard(); const before = a ? a.getBoundingClientRect().top : 0;
    document.body.setAttribute('data-plain', m);
    document.querySelectorAll('input[name="plain-mode"]').forEach(function (r) { r.checked = r.value === m; });
    try { localStorage.setItem(STORAGE_KEY + '-plain', m); } catch (e) {}
    fitNotes();
    if (a) window.scrollBy(0, a.getBoundingClientRect().top - before); // the card you were reading stays where it was
  }
  function pairText(el, plain, tag) {
    if (!el || !plain) return;
    el.classList.add('p-full');
    const sp = document.createElement(tag || 'span'); sp.className = (el.className.replace(/\bp-full\b/, '').trim() || '') + ' p-prosty';
    sp.innerHTML = textHtml(plain); el.insertAdjacentElement('beforebegin', sp);
  }
  function applyPlain(plain) {
    const cards = isMap(plain.cards) ? plain.cards : null; if (!cards) return 0; let n = 0;
    CARDS.forEach(function (c) {
      const p = isMap(cards[c.id]) ? cards[c.id] : null; const art = document.getElementById('card-' + c.id); if (!p || !art) return; n++;
      const h3 = art.querySelector('.card-head h3'); const title = plainText(p.title);
      if (h3 && title) h3.innerHTML = '<span class="p-full">' + h3.innerHTML + '</span><span class="t-plain p-prosty">' + textHtml(title) + '</span>';
      const ctx = art.querySelector('.ctx'); if (ctx && ctx.parentElement) ctx.parentElement.classList.add('p-full');
      const fp = art.querySelector('.fp'); if (fp) fp.classList.add('p-full');
      const opts = isMap(p.opts) ? p.opts : {}; const codex = plainText(p.codex);
      // plain: the plain texts take the place of the card's own, inside the same controls.
      art.querySelectorAll('.opt').forEach(function (o) {
        const input = o.querySelector('input'); const why = o.querySelector('.why'); if (why) why.classList.add('p-full');
        pairText(o.querySelector('.opt-t'), input ? plainText(opts[input.value]) : '');
      });
      const sugg = art.querySelector('.sugg');
      if (sugg) pairText(sugg.querySelector('.sugg-note'), codex, 'div');
      // both and plain: one summary block under the head; in both it also lists the options and the proposal in short.
      const paras = [];
      if (plainText(p.problem)) paras.push('<p>' + textHtml(p.problem) + '</p>');
      if (plainText(p.was)) paras.push('<p><b>' + th('plain.was') + '</b> ' + textHtml(p.was) + '</p>');
      if (plainText(p.fix)) paras.push('<p><b>' + th('plain.fix') + '</b> ' + textHtml(p.fix) + '</p>');
      const items = c.opts.filter(function (o) { return plainText(opts[o.k]); }).map(function (o) {
        return '<li><span class="optkey">(' + escapeHtml(o.k) + ')</span> ' + textHtml(opts[o.k]) + (o.rec ? ' <span class="chip ok">' + th('tag.recommended') + '</span>' : '') + '</li>';
      });
      if (items.length) paras.push('<div class="p-oba"><b>' + th('plain.options') + '</b><ul>' + items.join('') + '</ul></div>');
      if (codex && sugg) paras.push('<p class="p-oba"><b>' + th('plain.proposal') + '</b> ' + textHtml(codex) + '</p>');
      if (plainText(p.amends)) paras.push('<p class="amends">' + th('plain.amends') + ' ' + textHtml(p.amends) + '</p>');
      if (paras.length) {
        const b = document.createElement('div'); b.className = 'plain-block p-plain';
        b.innerHTML = '<div class="section-label">' + th('plain.section') + '</div>' + paras.join('');
        art.querySelector('.card-head').insertAdjacentElement('afterend', b);
      }
    });
    return n;
  }
  function loadPlain() {
    if (typeof fetch !== 'function') return;
    fetch('plain.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (plain) {
      if (!isMap(plain)) return; const n = applyPlain(plain); if (!n) return;
      const panel = document.getElementById('plain-panel'); panel.hidden = false;
      const who = plainText(plain.by) ? ' (' + plain.by + (plainText(plain.date) ? ', ' + plain.date : '') + ')' : '';
      document.getElementById('plain-by').textContent = tx('plain.by', { n: n, total: CARDS.length, who: who });
      let m = 'prosty'; try { m = localStorage.getItem(STORAGE_KEY + '-plain') || m; } catch (e) {}
      setPlainMode(m);
      panel.querySelectorAll('input[name="plain-mode"]').forEach(function (r) { r.addEventListener('change', function () { setPlainMode(r.value); }); });
    }).catch(function () {});
  }
  loadPlain();
})();
</script>
