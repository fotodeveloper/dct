name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ruff is PINNED (K-46): an unpinned `uvx ruff` lints with whatever ruff
  # shipped last — its default rule set grows between releases, so the same
  # tree went 0 → 248 findings without a single code change. Bump the pin
  # deliberately (and re-zero the baseline in the same commit).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff@0.16.0 check dct/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[all]'
      - name: Pytest
        run: pytest -q

      # README only — the dctools.dev checkout is a local, remote-less repo.
      # Cover the published pages at release time with --site <checkout>.
      - name: Advertised numbers
        run: python scripts/check_numbers.py
