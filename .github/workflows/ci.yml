name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ruff is PINNED (K-46): an unpinned `uvx ruff` lints with whatever ruff
  # shipped last — its default rule set grows between releases, so the same
  # tree went 0 → 248 findings without a single code change. Bump the pin
  # deliberately (and re-zero the baseline in the same commit).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff@0.16.0 check dct/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[all]'
      - name: Pytest
        run: pytest -q

      # README only — the dctools.dev checkout is a local, remote-less repo.
      # Cover the published pages at release time with --site <checkout>.
      - name: Advertised numbers
        run: python scripts/check_numbers.py

  # PostgreSQL is the primary backend (#426), but the suite above runs on
  # SQLite only — dialect-divergent behaviour (partial unique indexes, strict
  # GROUP BY, BOOLEAN literals in the migration runner) was verified by hand.
  # This lane runs the SAME suite against a real server: tests/conftest.py
  # picks up DCT_TEST_DATABASE_URL and isolates each test with
  # DROP SCHEMA public CASCADE. Python floor only — the SQLite matrix already
  # covers 3.12/3.13, and this job must not double the CI bill.
  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dct
          POSTGRES_PASSWORD: dct
          POSTGRES_DB: dct_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dct"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[all]'
      # DCT_EXPECT_PG arms the sentinel in tests/test_pg_lane.py (K-32): if
      # DCT_TEST_DATABASE_URL ever stops reaching conftest, this job would
      # otherwise re-run the SQLite suite and stay green. The database name
      # must satisfy the throwaway guard (K-31) — a `test`/`ci` segment.
      - name: Pytest (PostgreSQL)
        env:
          DCT_TEST_DATABASE_URL: postgresql+psycopg://dct:dct@localhost:5432/dct_ci
          DCT_EXPECT_PG: "1"
        run: pytest -q -rs
