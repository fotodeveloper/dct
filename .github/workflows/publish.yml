# Publishes the `dctracker` distribution to PyPI on every `v*` tag push.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# One-time setup on pypi.org: project `dctracker` → Publishing → add
# GitHub publisher: owner `fotodeveloper`, repo `dct`,
# workflow `publish.yml`, environment `pypi`.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  # Mirror of ci.yml's lint job (K-46) — the release gate must never be
  # weaker than the branch gate. Keep the ruff pin in lockstep with ci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.16.7 check dct/ tests/

  # Keep this matrix identical to ci.yml's. A narrower gate here published
  # 1.2.0 while CI was red on 3.11 — the release gate must never be weaker
  # than the branch gate.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[all]'
      - run: pytest -q

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-pushed tag (e.g. after a history rewrite) rebuilds identical
          # files; PyPI refuses duplicates — skip instead of failing the run.
          skip-existing: true
