[project]
name = "dctracker"
description = "Deterministic Context Tracker (dct) — cross-project tracking, changelog, and release tooling for Claude Code."
version = "1.5.0"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fotodeveloper", email = "dev@fotodeveloper.com" }]
readme = "README.md"
keywords = ["claude-code", "mcp", "tracking", "changelog", "sprints", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "packaging>=26.3",  # PEP 440/508 validation for per-runtime integration diagnostics
    "sqlalchemy>=2.0.52",
    "python-ulid>=4.0.1",
    # Windows-only: POSIX resolves XDG dirs in-house (dct/paths.py, ADR #52);
    # >=4.9.6 for the macOS XDG fixes should the marker ever widen.
    "platformdirs>=4.11.8; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://dctools.dev"
Repository = "https://github.com/fotodeveloper/dct"
Changelog = "https://github.com/fotodeveloper/dct/blob/main/changelog.md"

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.3.5"]
mcp = ["mcp>=2.2,<3"]  # SDK 2.x API; [cli] remains a host-side development extra
web = ["flask>=3.1.3", "markdown>=3.10.3"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
all = ["psycopg[binary]>=3.3.5", "mcp>=2.2,<3", "flask>=3.1.3", "markdown>=3.10.3", "pytest>=9.1.1", "pytest-cov>=7.1.0"]

[project.scripts]
dct = "dct.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# E701 (one-line `if x: y`) and E741 (short names like `l`) are accepted house
# style in compact CLI/test code; everything else in ruff's default set applies.
ignore = ["E701", "E741"]

[tool.ruff.lint.isort]
# Pin first-party classification: ruff otherwise infers it from what exists on
# disk, so a TDD-red test importing a module that is not written yet gets its
# import block reported as un-sorted (I001) until the module lands.
known-first-party = ["dct"]

[tool.ruff.lint.per-file-ignores]
# Deliberate blanket catches (BLE001): each surface converts ANY failure into
# its error contract instead of raising — MCP tools return {"error": ...}, CLI
# commands print "✗ Error" and exit non-zero, and the passive update probe is
# documented "never raises".
"dct/mcp/server.py" = ["BLE001"]
"dct/cli.py" = ["BLE001"]
"dct/update.py" = ["BLE001"]
# Hook tests assert returncode explicitly — check= on every run() is noise.
"tests/test_hook_*.py" = ["PLW1510"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dct = [
    "skills/**/*.md",
    "hooks/*.sh",
    "assets/*.md",
    "assets/*.sh",
    "web/templates/*",
    "web/templates/**/*",
    "web/static/*",
    "web/static/**/*",
]

[tool.setuptools.packages.find]
include = ["dct*"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
